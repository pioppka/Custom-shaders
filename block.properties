# 10: agua   11: cristal transparente   12: hielo   13: slime/miel   14: portal del Nether   15: lava
block.10 = water
block.11 = glass glass_pane

# cristal transparente como translúcido para que refracte por dentro
layer.translucent = glass glass_pane

# seagrass y corales: con Polytone pueden ser translúcidos
layer.cutout = seagrass tall_seagrass kelp kelp_plant tube_coral brain_coral bubble_coral fire_coral horn_coral \
    tube_coral_fan brain_coral_fan bubble_coral_fan fire_coral_fan horn_coral_fan \
    tube_coral_wall_fan brain_coral_wall_fan bubble_coral_wall_fan fire_coral_wall_fan horn_coral_wall_fan

# portal emisivo con lo opaco, para que el agua y el cristal lo refracten
#ifdef PORTAL_EMISSIVE
layer.solid = nether_portal
#endif
block.12 = ice frosted_ice
block.13 = slime_block honey_block
block.14 = nether_portal
block.15 = lava

