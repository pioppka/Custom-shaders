#==============================================================================
#  MrPixel Shaders - shaders.properties (Iris 1.11 / Minecraft 26.3)
#==============================================================================

iris.features.required = COMPUTE_SHADERS CUSTOM_IMAGES PER_BUFFER_BLENDING SSBO
iris.features.optional = ENTITY_TRANSLUCENT BLOCK_EMISSION_ATTRIBUTE

oldLighting = false
separateAo = true
clouds = fancy
sun = true
moon = true
vignette = false
underwaterOverlay = false
rain.depth = false
beacon.beam.depth = true

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true
# con floodfill, completo hasta voxelDistance (vóxeles)
#ifdef FLOODFILL
shadow.culling = safe_zone
#else
shadow.culling = true
#endif

#------------------------------------------------------------------------------
# Vóxeles y floodfill (lib/voxel.glsl)
#------------------------------------------------------------------------------
#ifdef FLOODFILL
image.voxelImg = voxelSampler red_integer r32ui unsigned_int true false 1280 128 128
image.lightImgA = lightSamplerA rgba rgba16f half_float false false 128 128 128
image.lightImgB = lightSamplerB rgba rgba16f half_float false false 128 128 128
image.lightDirImg = lightDirSampler rgba rgba16f half_float false false 128 128 128
# texturas extra (composite.csh); ocupación del follaje (shadowcomp1)
image.extraTexImg = extraTexSampler rgba rgba8 unsigned_byte false false 640 64
image.foliageOccImg = foliageOccSampler rg rg16f half_float false false 128 128 128
#endif
# entidades que arden, sin floodfill
#ifndef FLOODFILL
image.fireLightImg = fireLightSampler red_integer r32ui unsigned_int true false 17 1
#endif
program.setup.enabled = FLOODFILL
# orilla de la espuma sin floodfill: agua y bloques alrededor de la cámara
#ifndef FLOODFILL
#ifdef WATER_FOAM
image.shoreImg = shoreSampler red_integer r32ui unsigned_int true false 64 32 64
#endif
#endif
# shadowcomp vacío: barrera de memoria para los compute
program.shadowcomp1.enabled = FLOODFILL
program.shadowcomp2.enabled = WATER_SIM
program.shadowcomp3.enabled = GROUND_FOG

#------------------------------------------------------------------------------
# Niebla de suelo (lib/groundfog.glsl). Tamaños según GROUND_FOG_DISTANCE (y workGroups de shadowcomp3).
#------------------------------------------------------------------------------
#ifdef FLOODFILL
#ifdef GROUND_FOG
#if GROUND_FOG_DISTANCE == 64
image.fogImgA = fogSamplerA rg rg16f half_float false false 256 256 256
image.fogImgB = fogSamplerB rg rg16f half_float false false 256 256 256
image.fogMaskImg = fogMaskSampler red_integer r32ui unsigned_int true false 128 64 128
image.fogPushImg = fogPushSampler red_integer r32ui unsigned_int true false 128 64 128
#elif GROUND_FOG_DISTANCE == 32
image.fogImgA = fogSamplerA rg rg16f half_float false false 128 256 128
image.fogImgB = fogSamplerB rg rg16f half_float false false 128 256 128
image.fogMaskImg = fogMaskSampler red_integer r32ui unsigned_int true false 64 64 64
image.fogPushImg = fogPushSampler red_integer r32ui unsigned_int true false 64 64 64
#else
image.fogImgA = fogSamplerA rg rg16f half_float false false 192 256 192
image.fogImgB = fogSamplerB rg rg16f half_float false false 192 256 192
image.fogMaskImg = fogMaskSampler red_integer r32ui unsigned_int true false 96 64 96
image.fogPushImg = fogPushSampler red_integer r32ui unsigned_int true false 96 64 96
#endif
#endif
#endif

#------------------------------------------------------------------------------
# Olas interactivas: 1024x1024 celdas
#------------------------------------------------------------------------------
#ifdef WATER_SIM
image.waveImgA = waveSamplerA rgba rgba16f half_float false false 1024 1024
image.waveImgB = waveSamplerB rgba rgba16f half_float false false 1024 1024
image.waveImpulseImg = waveImpulseSampler red_integer r32ui unsigned_int true false 1024 1024
#endif

# Color de agua para la niebla submarina
image.waterFog = waterFogSampler rgba rgba16f half_float false false 1 1
image.waterFogDepth = waterFogDepthSampler red_integer r32ui unsigned_int true false 1 1
image.waterFogIndex = waterFogIndexSampler red_integer r32ui unsigned_int true false 1 1

# reflejo plástico difuso: trazado + desenfoque en dos pasadas
program.composite1.enabled = PLASTIC_REFLECTIONS
program.composite2.enabled = PLASTIC_REFLECTIONS
program.composite3.enabled = PLASTIC_REFLECTIONS

# Texturas para el trazado de rayos. Atlas de bloques:
customTexture.blockAtlasTex = minecraft:textures/atlas/blocks.png
# mapa especular (1x1 sin PBR):
customTexture.blockAtlasSpecTex = minecraft:textures/atlas/blocks_s.png
# amatista, antorchas y arbusto de luciérnagas:
customTexture.amethystClusterTex = minecraft:textures/block/amethyst_cluster.png
customTexture.amethystLargeTex = minecraft:textures/block/large_amethyst_bud.png
customTexture.amethystMediumTex = minecraft:textures/block/medium_amethyst_bud.png
customTexture.amethystSmallTex = minecraft:textures/block/small_amethyst_bud.png
customTexture.torchTex = minecraft:textures/block/torch.png
customTexture.soulTorchTex = minecraft:textures/block/soul_torch.png
customTexture.redstoneTorchTex = minecraft:textures/block/redstone_torch.png
customTexture.copperTorchTex = minecraft:textures/block/copper_torch.png
customTexture.fireflyBushTex = minecraft:textures/block/firefly_bush.png
customTexture.fireflyBushGlowTex = minecraft:textures/block/firefly_bush_emissive.png

#------------------------------------------------------------------------------
# Mezcla por buffer (en los G-buffers el alfa es cobertura: 1 escribe, 0 no)
#------------------------------------------------------------------------------
blend.gbuffers_terrain.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_terrain.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_terrain.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured_lit.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds.colortex0 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds.colortex2 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_clouds.colortex4 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# líneas: las opacas se marcan como texto, las translúcidas no tocan el material
blend.gbuffers_line.colortex1 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

# capa translúcida: alfa premultiplicado
blend.gbuffers_water.colortex5 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex6 = off
blend.gbuffers_water.colortex8 = off
blend.gbuffers_particles.colortex5 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent.colortex5 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_weather.colortex5 = ONE ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
# las entidades translúcidas borran lo de detrás en esa capa
blend.gbuffers_entities_translucent.colortex5 = ZERO ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities.colortex5 = ZERO ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA
blend.gbuffers_block.colortex5 = ZERO ONE_MINUS_SRC_ALPHA ZERO ONE_MINUS_SRC_ALPHA

#------------------------------------------------------------------------------
# Búferes: 0 lib/state.glsl, 1 lib/watersim.glsl
#------------------------------------------------------------------------------
bufferObject.0 = 256
#ifdef WATER_SIM
bufferObject.1 = 8388608
#endif

#------------------------------------------------------------------------------
# Perfiles
#------------------------------------------------------------------------------
# Los valores por defecto de settings.glsl son el perfil ALTO.
profile.BAJO = shadowMapResolution=1024 shadowDistance=96.0 !COLORED_SHADOWS !FLOODFILL !GROUND_FOG REFLECTION_MODE=1 RT_STEPS=32 !SMOOTH_REFLECTIONS !PLASTIC_REFLECTIONS !WATER_SIM !BACKLIGHT !LEAF_SSS !LENS_FLARE !RAIN_PUDDLES
profile.MEDIO = shadowMapResolution=2048 shadowDistance=128.0 COLORED_SHADOWS !FLOODFILL !GROUND_FOG REFLECTION_MODE=1 RT_STEPS=48 SMOOTH_REFLECTIONS !PLASTIC_REFLECTIONS WATER_SIM BACKLIGHT !LEAF_SSS LENS_FLARE RAIN_PUDDLES
profile.ALTO = shadowMapResolution=2048 shadowDistance=128.0 COLORED_SHADOWS !FLOODFILL GROUND_FOG REFLECTION_MODE=1 RT_STEPS=96 SMOOTH_REFLECTIONS !PLASTIC_REFLECTIONS WATER_SIM BACKLIGHT LEAF_SSS LENS_FLARE RAIN_PUDDLES
profile.ULTRA = shadowMapResolution=2048 shadowDistance=192.0 COLORED_SHADOWS FLOODFILL GROUND_FOG REFLECTION_MODE=2 RT_STEPS=192 SMOOTH_REFLECTIONS PLASTIC_REFLECTIONS WATER_SIM BACKLIGHT LEAF_SSS LENS_FLARE RAIN_PUDDLES

